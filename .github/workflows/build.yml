name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool openbox
      - run: npm install
      - run: npm test
      - name: End-to-end (real app, fake microphone, virtual screen, real window switching)
        run: npm run test:e2e
      - run: npx playwright-core install --with-deps chromium
      - name: Chrome extension (real Chromium + mock chat pages) and full chain
        run: |
          npm run test:ext
          npm run test:full
      - name: Only-my-voice (real app, fake microphone conversation, real speaker-recognition model)
        run: npm run test:voice

  package:
    # Mac/Windows installers are built by hand (Actions > Run workflow): Mac build minutes are scarce
    if: github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - name: Paste scripts are valid on this OS
        run: node test/ci/check-scripts.js
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Claude-Eyes-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
          if-no-files-found: error
