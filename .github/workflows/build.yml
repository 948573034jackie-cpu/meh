name: Build ClaudeSnap
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac-app:
    runs-on: macos-15   # (GitHub no longer runs macos-14)
    steps:
      - uses: actions/checkout@v4
      - name: Compile ClaudeSnap for macOS 12+ (Intel + Apple Silicon)
        working-directory: ClaudeSnap
        run: |
          swiftc -O -target x86_64-apple-macos12.0 main.swift -o snap-x86_64
          swiftc -O -target arm64-apple-macos12.0 main.swift -o snap-arm64
          plutil -lint Info.plist
          mkdir -p ClaudeSnap.app/Contents/MacOS
          lipo -create snap-x86_64 snap-arm64 -output ClaudeSnap.app/Contents/MacOS/ClaudeSnap
          cp Info.plist ClaudeSnap.app/Contents/Info.plist
          codesign --force --deep --sign - ClaudeSnap.app
          ditto -c -k --keepParent ClaudeSnap.app ClaudeSnap.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: ClaudeSnap/ClaudeSnap.zip

  ios:
    runs-on: macos-15   # (GitHub no longer runs macos-14)
    steps:
      - uses: actions/checkout@v4
      # (The builder's Xcode, 16.3 or later, links a WebKit helper that iOS only has from 18.4: this app needs iOS 18.4
      # or later. Its Xcode 16.2 would not: but the builder has no simulator for it, and the build needs one.)
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          ./sync-scripts.sh
          xcodegen generate
          xcodebuild -version
          # XcodeGen writes the newest project file format (77, Xcode 16). Xcode 14/15 cannot open that: use format 56.
          grep -n "objectVersion\|preferredProjectObjectVersion\|compatibilityVersion" YTLearn.xcodeproj/project.pbxproj
          sed -i '' -E 's/objectVersion = [0-9]+;/objectVersion = 56;/; s/preferredProjectObjectVersion = [0-9]+;/preferredProjectObjectVersion = 56;/' YTLearn.xcodeproj/project.pbxproj
          grep -n "objectVersion\|preferredProjectObjectVersion" YTLearn.xcodeproj/project.pbxproj
      - name: Compile for iPhone/iPad Simulator (checks the code)
        working-directory: ios
        shell: bash
        run: |
          xcodebuild -project YTLearn.xcodeproj -scheme YTLearn -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-sim.log | tail -40
      - name: Check the JavaScript files are inside the app
        working-directory: ios
        run: |
          APP=build-sim/Build/Products/Debug-iphonesimulator/YTLearn.app
          ls "$APP" | head -30
          for f in shim-common shim-youtube shim-dream lib background youtube dream-bg dream-yt dream-web page-hooks; do test -f "$APP/$f.js" || { echo "MISSING $f.js"; exit 1; }; done
          # My tutor's own files (ytlearn://app/dream/…): the dictionary, the settings and vocabulary pages
          for f in dict.json.gz zipf.json.gz options.html options.js vocab.html vocab-page.js pages.css reader.html reader.js; do test -f "$APP/Web/dream/$f" || { echo "MISSING Web/dream/$f"; exit 1; }; done
          plutil -p "$APP/Info.plist" | grep -A2 UIBackgroundModes
          plutil -p "$APP/Info.plist" | grep -E "Microphone|Speech|DisplayName|UILaunch|ShortVersion" || true
          # (the app's name under its icon: "I Know")
          plutil -p "$APP/Info.plist" | grep -q '"CFBundleDisplayName" => "I Know"' || { echo "the app's name is not I Know"; exit 1; }
      - name: Run the app in an iPhone and an iPad Simulator and test it on the real YouTube page
        continue-on-error: true   # (the simulator of a busy builder must not keep the app from being packed; its log is read)
        working-directory: ios
        shell: bash
        run: |
          mkdir -p ../shots
          xcodebuild -version | tr "\n" " "; echo; xcrun simctl list runtimes | grep -i ios || true
          for KIND in "iPhone 1" "iPad"; do   # (any iPhone 15, 16, 17 … the builder has)
            # (the last one in the list: the newest iOS the builder has, the one its Xcode builds for)
            UDID=$(xcrun simctl list devices available | grep -F "$KIND" | tail -1 | grep -oE "[0-9A-F-]{36}")
            echo "=================== simulator for '$KIND': $UDID"
            if [ -z "$UDID" ]; then echo "NO SIMULATOR FOUND for $KIND"; xcrun simctl list devices available; exit 1; fi
            xcrun simctl list devices available | grep "$UDID"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/YTLearn.app
            # (a builder under load: the first start of an app can be refused or slow; tried up to 3 times)
            for TRY in 1 2 3; do xcrun simctl launch "$UDID" local.ytlearn.app -selftest && break; sleep 20; done
            DATA=$(xcrun simctl get_app_container "$UDID" local.ytlearn.app data || true)
            for W in $(seq 1 30); do [ -f "$DATA/Documents/selftest.json" ] && break; sleep 5; done
            # (the test on the real YouTube page starts 30 s after the app: wait until its part is in the report)
            for W in $(seq 1 24); do grep -q '"youtube"' "$DATA/Documents/selftest.json" 2>/dev/null && break; sleep 5; done
            sleep 5
            xcrun simctl io "$UDID" screenshot "../shots/simulator-$(echo "$KIND" | tr -cd 'A-Za-z0-9').png" || true
            echo "----- self-test report ($KIND) -----"
            cat "$DATA/Documents/selftest.json" || echo "NO REPORT WRITTEN"
            echo "----- is the app still running? (a line here = yes) -----"
            xcrun simctl spawn "$UDID" launchctl list | grep -i ytlearn || echo "NOT RUNNING: the app closed by itself"
            echo "----- crash reports of the app, if any -----"
            (ls -t ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i ytlearn | head -3) || true
            CR=$(ls -t ~/Library/Logs/DiagnosticReports/*YTLearn* 2>/dev/null | head -1 || true)
            if [ -n "$CR" ]; then head -c 6000 "$CR"; else echo "(none)"; fi
            xcrun simctl shutdown "$UDID" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-screenshot
          path: shots/*.png
          if-no-files-found: ignore
      - name: Build the iPhone/iPad app (not signed) and pack it as an .ipa
        working-directory: ios
        shell: bash
        run: |
          xcodebuild -project YTLearn.xcodeproj -scheme YTLearn -sdk iphoneos \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -20
          mkdir -p Payload
          cp -R build-dev/Build/Products/Release-iphoneos/YTLearn.app Payload/
          zip -qr YTLearn-unsigned.ipa Payload
          ls -la YTLearn-unsigned.ipa
          rm -rf Payload build-sim build-dev *.log
          cd .. && zip -qr ios/YTLearn-Xcode-project.zip ios -x "ios/*.ipa" -x "ios/*.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: |
            ios/YTLearn-unsigned.ipa
            ios/YTLearn-Xcode-project.zip

  # (the Safari extension app, YT Safari, is no longer built: only the app itself, YT Learn, is wanted)

  js-webkit:
    runs-on: ubuntu-24.04   # (Playwright 1.56 has no browsers for the newer ubuntu-latest yet)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (WebKit = Safari's engine)
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps webkit >/dev/null
      - name: Unit tests (sentences, subtitle-list formats)
        run: node tests/lib-unit.js
      - name: My tutor in the iPhone/iPad app, in WebKit (the app's scripts + a stand-in for its Swift side)
        if: always()
        run: ./ios/sync-scripts.sh && node tests/ios-webkit-test.js
      - name: The app's page on each device and way round (iPhone / iPad, portrait / landscape), in WebKit
        if: always()
        run: node tests/ios-layout-test.js
      - name: The app with the tutor off (Free mode = no AI call), in WebKit
        if: always()
        run: node tests/ios-free-test.js
      - name: I Know 3.8 (full screen, One button mode, the tutor's volume, the iPad layout, film-like subtitles), in WebKit
        if: always()
        run: node tests/ios-38-test.js
      - name: Find me a video and the lyrics (one AI request per search / per song), in WebKit
        if: always()
        run: node tests/finder-lyrics-test.js
      - name: The reader (EPUB, text, the library, hard words, the word card), in WebKit
        if: always()
        run: |
          # (the test makes its small e-book with the reader's own zip library)
          (cd dream-ext && npm ci --ignore-scripts --no-audit --no-fund >/dev/null)
          node tests/reader-test.js
      - name: The browser with Explanation mode (tap a word, a link, a selection, "hello"), in WebKit
        if: always()
        run: node tests/ios-browser-test.js

  dream-tutor:
    runs-on: ubuntu-24.04   # (Playwright 1.56 has no browsers for the newer ubuntu-latest yet)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dream Tutor - type check, unit tests, build (the built files in the extension must match the source)
        working-directory: dream-ext
        run: |
          npm ci
          npm run typecheck
          npm test
          node build.mjs
          git diff --exit-code -- ../youtube-to-claude/dream || { echo "youtube-to-claude/dream is out of date: run node build.mjs in dream-ext and commit"; exit 1; }
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: The real extension in Chrome - the Dream Tutor on a test YouTube page with a test AI
        run: CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/dream-e2e.js
      - name: Level Check - the real extension, the real helper and files, a video and a PDF
        if: always()
        run: CHROME=$(node -e "console.log(require('playwright').chromium.executablePath())") node tests/level-check-e2e.js

  real-sites:
    runs-on: ubuntu-24.04   # (Playwright 1.56 has no browsers for the newer ubuntu-latest yet)
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null
          npm i playwright@1.56.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Level Check on a real YouTube video (subtitles, the test, the chosen stops)
        run: node tests/real-level-check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-site-screenshots
          path: /tmp/*.png

  release:
    needs: [mac-app, ios]
    if: github.ref_name == 'claude/new-session-pxh22u' || github.ref_name == 'claude/level-check-iphone'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd chrome-extension && zip -qr ../ClaudeSnap-Chrome.zip .)
          (cd youtube-to-claude && zip -qr ../YouTube-to-Claude.zip .)
          # (the Level Check branch has a release of its own: the main downloads stay as they are)
          TAG=claudesnap-latest; [ "${{ github.ref_name }}" = "claude/level-check-iphone" ] && TAG=level-check-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            dl/mac-app/ClaudeSnap.zip ClaudeSnap-Chrome.zip YouTube-to-Claude.zip \
            dl/ios/YTLearn-unsigned.ipa dl/ios/YTLearn-Xcode-project.zip \
            --title "ClaudeSnap downloads" \
            --notes "Mac app, Chrome extensions, and the iPhone/iPad app (I Know)." \
            --target "${{ github.sha }}"
