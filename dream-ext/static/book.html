<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>I Know Book</title>
<link rel="stylesheet" href="theme.css">
<style>
/* I Know Book. One calm page: the text, and nothing else until it is asked for. Two kinds of colours:
   --t-* = the one look of both apps (theme.css, from design/theme.json): the library, every bar, button and sheet;
   --bk-* = the reading page itself (the reader's theme: Paper, Sepia, Green, Night…, and text settings), from
   book-look.ts as CSS variables on <html>. book.ts sets data-theme="light" / "dark" on <html> from the reading theme,
   so the bars and sheets are light on a light page and dark on a dark one (Auto = as the iPhone is set). Everything that is "hidden" is really not on the screen.
   Speed: a tap is taken at once (touch-action: manipulation, no wait for a second tap); nothing is blurred behind the
   bars or the cards (solid colours); the card comes and goes with no transition; only transform and opacity move.
   The column and the page shift are written on #flow itself by book.ts, never as a variable on <html>. */
:root{--bk-bg:#FAF6EC;--bk-fg:#23201A;--bk-muted:#7d776c;--bk-faint:#b3ad9f;--bk-line:#e6e0d2;--bk-soft:#f1ecdf;--bk-raised:#fffdf7;--bk-accent:#9A5B1E;--bk-accent-soft:#eadfce;--bk-hard:#2A62B8;--bk-learning:#B07A00;--bk-on-accent:#fff;
  --bk-font:ui-serif,Georgia,serif;--bk-size:20px;--bk-line-height:1.5;--bk-margin:24px;--bk-letter:0em;--bk-word:0em;--bk-para:.7em;--bk-align:left;--bk-weight:400;
  --ui:var(--t-font-ui);--zh:var(--t-font-zh);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:var(--bk-bg);color:var(--bk-fg);font-family:var(--ui);-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
html,body,#rd,#card,#small,.sheet{touch-action:manipulation}
body{overflow:hidden;position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{opacity:.35}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--t-focus);outline-offset:2px}
svg{display:block}
.ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the library ---------- */
#lib,#words,#set{position:absolute;inset:0;overflow-y:auto;background:var(--t-bg);color:var(--t-text);-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 18px) calc(var(--sr) + 22px) calc(var(--bot) + 96px) calc(var(--sl) + 22px)}
#words,#set{-webkit-user-select:text;user-select:text}
#words .wrap,#set .wrap{max-width:720px;margin:0 auto}
/* ---------- the tab bar: Books · Words · Settings (the same as I Know's native one); gone while a book is open ---------- */
#tabs{position:absolute;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(3,1fr);background:var(--t-raised);border-top:1px solid var(--t-line);padding:2px calc(var(--sr) + 4px) var(--bot) calc(var(--sl) + 4px)}
#tabs button{min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--t-muted);font:var(--t-weight-caption) var(--t-size-caption)/1 var(--ui)}
#tabs button .ic{width:24px;height:24px}
#tabs button.on{color:var(--t-accent)}
#tabs button:active{background:var(--t-hover)}
h1.page{font:700 var(--t-size-large-title)/1.2 var(--t-font-serif);margin:0 0 var(--t-space-l)}
#lib .wrap{max-width:820px;margin:0 auto}
.mast{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.mark{font:600 var(--t-size-caption)/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--t-muted)}
.mark b{color:var(--t-text);font-weight:700}
.round{width:var(--t-control);height:var(--t-control);border-radius:var(--t-radius-pill);display:grid;place-items:center;color:var(--t-text)}
.round:active{background:var(--t-hover)}
#hero{display:flex;gap:20px;align-items:stretch;padding:0 0 28px;margin-bottom:26px;border-bottom:1px solid var(--t-line)}
#hero .cover{flex:none;width:118px}
#hero .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
#hero .eyebrow{font:600 var(--t-size-caption)/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--t-accent)}
#hero h2{margin:0;font:600 var(--t-size-title)/1.2 var(--t-font-serif);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
#hero .by{color:var(--t-muted);font-size:var(--t-size-footnote)}
#hero .acts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.pill{min-height:var(--t-control);padding:0 var(--t-space-l);border-radius:var(--t-radius-control);font:var(--t-weight-button) var(--t-size-button)/1 var(--ui);display:inline-flex;align-items:center;gap:var(--t-space-s);border:1px solid var(--t-line-strong);color:var(--t-text);background:var(--t-raised)}
.pill.go{background:var(--t-accent);color:var(--t-accent-text);border-color:var(--t-accent)}
.pill:active{opacity:.7}
.pill .ic{width:18px;height:18px}
.bar-prog{height:4px;border-radius:2px;background:var(--t-line);overflow:hidden;margin-top:6px}
.bar-prog i{display:block;height:100%;background:var(--t-accent);border-radius:2px}
h3.sec{font:600 var(--t-size-caption)/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--t-muted);margin:0 0 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:26px 20px}
.tile{display:flex;flex-direction:column;gap:9px;text-align:left;min-width:0}
.tile .t{font:500 var(--t-size-footnote)/1.3 var(--ui);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .p{font-size:var(--t-size-caption);color:var(--t-muted)}
.cover{aspect-ratio:2/3;border-radius:4px 7px 7px 4px;position:relative;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.14),0 10px 22px -10px rgba(0,0,0,.42);display:flex;flex-direction:column;justify-content:space-between;padding:17% 15% 15% 19%;color:#fff}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.cover::after{content:"";position:absolute;inset:7% 7% 7% 11%;border:1px solid rgba(255,255,255,.28);border-radius:2px;pointer-events:none}
.cover .ct{font:600 12.5px/1.22 ui-serif,Georgia,serif;letter-spacing:.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;position:relative}
.cover .ca{font:500 8.5px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;opacity:.8;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hero .cover .ct{font-size:14px}
.tile.add .cover{background:transparent;box-shadow:none;border:1.5px dashed var(--t-faint);color:var(--t-muted);align-items:center;justify-content:center;padding:0}
.tile.add .cover::before,.tile.add .cover::after{display:none}
.tile.add .ic{width:30px;height:30px}
#empty{text-align:center;padding:9vh 8px 0;max-width:420px;margin:0 auto}
#empty h1{font:600 var(--t-size-large-title)/1.2 var(--t-font-serif);margin:0 0 var(--t-space-m)}
#empty p{color:var(--t-muted);font-size:var(--t-size-body);line-height:1.5;margin:0 0 26px}
#empty .acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#empty .pill{justify-content:center;min-height:var(--t-control-main)}
#empty .pill.quiet{border-color:transparent;background:transparent;color:var(--t-accent);min-height:var(--t-control)}
#empty .pill.go .ic{width:22px;height:22px}
#lib-msg{color:var(--t-off);font-size:var(--t-size-footnote);margin:14px 0 0;min-height:1em}

/* ---------- the reading page ---------- */
#rd{position:absolute;inset:0}
#page{position:absolute;left:var(--sl);right:var(--sr);top:calc(var(--top) + 30px);bottom:calc(var(--bot) + 30px);overflow:hidden;touch-action:pan-y}
/* Listening: the small player sits under the text, never on it */
#rd[data-mode="listen"] #page{bottom:calc(var(--bot) + 110px)}
#flow{height:100%;width:300px;margin:0 auto;column-width:300px;column-gap:48px;column-fill:auto;transform:translate3d(0,0,0);transition:transform .28s cubic-bezier(.2,.7,.2,1);
  font-family:var(--bk-font);font-size:var(--bk-size);line-height:var(--bk-line-height);letter-spacing:var(--bk-letter);word-spacing:var(--bk-word);text-align:var(--bk-align);font-weight:var(--bk-weight);
  -webkit-hyphens:manual;hyphens:manual;overflow-wrap:break-word;-webkit-user-select:text;user-select:text;orphans:2;widows:2;font-kerning:normal;text-rendering:optimizeLegibility}
#flow.jump{transition:none}
html[data-align="justify"] #flow{-webkit-hyphens:auto;hyphens:auto}
#flow p{margin:0 0 var(--bk-para)}
#flow p.h1,#flow p.h2,#flow p.h3{font-weight:700;line-height:1.25;text-align:left;break-after:avoid;-webkit-column-break-after:avoid;margin:.9em 0 .6em}
#flow p.h1{font-size:1.45em;margin-top:0} #flow p.h2{font-size:1.22em} #flow p.h3{font-size:1.08em}
#flow p.li{padding-left:1.1em} #flow p.blockquote{padding-left:1em;border-left:2px solid var(--bk-line);color:var(--bk-muted)}
#flow .chap{font:600 .62em/1.2 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--bk-muted);margin:0 0 1.6em;text-align:left;break-after:avoid;-webkit-column-break-after:avoid}
.s{border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.cur{background:var(--bk-accent-soft)}
.w{border-radius:3px}
.w.hard{text-decoration:underline dotted;-webkit-text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,var(--bk-hard) 55%,transparent);-webkit-text-decoration-color:color-mix(in srgb,var(--bk-hard) 55%,transparent);text-decoration-thickness:1px;text-underline-offset:.26em}
.w.learning{text-decoration:underline solid;-webkit-text-decoration:underline solid;text-decoration-color:color-mix(in srgb,var(--bk-learning) 80%,transparent);-webkit-text-decoration-color:color-mix(in srgb,var(--bk-learning) 80%,transparent);text-decoration-thickness:1.5px;text-underline-offset:.26em}
html[data-marks="0"] .w.hard,html[data-marks="0"] .w.learning{text-decoration:none;-webkit-text-decoration:none}
.w.pick{background:var(--bk-accent-soft)}
#foot{position:absolute;left:var(--sl);right:var(--sr);bottom:calc(var(--bot) + 6px);height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--bk-margin);font:500 var(--t-size-caption)/1 var(--ui);letter-spacing:.06em;color:var(--bk-muted);pointer-events:none}
#head{position:absolute;left:var(--sl);right:var(--sr);top:calc(var(--top) + 6px);height:20px;display:flex;align-items:center;justify-content:center;padding:0 var(--bk-margin);font:500 var(--t-size-caption)/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--bk-muted);pointer-events:none;white-space:nowrap;overflow:hidden}
#head span{overflow:hidden;text-overflow:ellipsis}

/* the bars that come when the middle of the page is tapped */
.chrome{position:absolute;left:0;right:0;z-index:20;background:var(--t-bg);color:var(--t-text);transition:transform var(--t-normal) cubic-bezier(.2,.7,.2,1),opacity var(--t-fast)}
#top{top:0;padding:calc(var(--top) + 4px) calc(var(--sr) + 8px) 4px calc(var(--sl) + 8px);display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--t-line)}
#top .ttl{flex:1;min-width:0;text-align:center;font:600 var(--t-size-body)/1.2 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
#top .aa{font:600 20px/1 var(--t-font-serif);display:inline-flex;align-items:baseline;justify-content:center;padding-top:11px}
#top .aa small{font-size:15px}
#bar{bottom:0;padding:10px calc(var(--sr) + 16px) calc(var(--bot) + 10px) calc(var(--sl) + 16px);border-top:1px solid var(--t-line);display:flex;flex-direction:column;gap:var(--t-space-m)}
#rd.plain #top{transform:translateY(-105%);opacity:0;pointer-events:none}
#rd.plain #bar{transform:translateY(105%);opacity:0;pointer-events:none}
.where{display:flex;align-items:center;gap:6px}
.where select{flex:1;min-width:0;height:var(--t-control);border:0;background:transparent;color:var(--t-text);font:500 var(--t-size-body)/1 var(--ui);text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--t-sunken);border-radius:var(--t-radius-control);padding:3px;gap:3px}
.seg2 button{min-height:var(--t-control);border-radius:calc(var(--t-radius-control) - 3px);font:var(--t-weight-button) var(--t-size-button)/1 var(--ui);color:var(--t-muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg2 button.on{background:var(--t-raised);color:var(--t-text);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg2 .ic{width:18px;height:18px}
.transport{display:flex;align-items:center;justify-content:center;gap:8px}
.transport .chip{min-width:62px;min-height:var(--t-control);padding:0 12px;border-radius:var(--t-radius-control);border:1px solid var(--t-line-strong);font:600 15px/1 var(--ui);color:var(--t-text);background:var(--t-raised);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.transport .chip{flex:none}
.transport #t-voice{display:block;line-height:42px;min-width:62px;flex:0 1 96px}
@media (max-width:340px){#bar{padding-left:calc(var(--sl) + 10px);padding-right:calc(var(--sr) + 10px)}.transport{gap:4px}.transport .step{width:44px;height:44px}.transport .playbtn{width:58px;height:58px}.transport .chip{min-width:54px;padding:0 8px;font-size:var(--t-size-caption)}.transport #t-voice{min-width:70px;flex-basis:84px}}
.transport .step{flex:none;width:48px;height:48px;border-radius:var(--t-radius-pill);display:grid;place-items:center;color:var(--t-text)}
.transport .playbtn{flex:none}
.transport .step:active,.transport .chip:active{background:var(--t-hover)}
.playbtn{width:66px;height:66px;border-radius:var(--t-radius-pill);background:var(--t-accent);color:var(--t-accent-text);display:grid;place-items:center;flex:none}
.playbtn:active{transform:scale(.96)}
.playbtn .ic{width:28px;height:28px;fill:currentColor;stroke:none}
/* listening with the bars away: one small player stays under the thumb */
#mini{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 30px);z-index:15;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:var(--t-radius-pill);background:var(--t-raised);color:var(--t-text);border:1px solid var(--t-line);box-shadow:var(--t-shadow)}
#mini .step{width:46px;height:46px;border-radius:var(--t-radius-pill);display:grid;place-items:center}
#mini .playbtn{width:56px;height:56px}
#rd:not(.plain) #mini,#rd[data-mode="read"] #mini{display:none}
/* Reading: Play is one tap too: in the bar, and (bars away) one small round button under the text, between the
   page number and the %, never on the text */
#rd[data-mode="read"] #page{bottom:calc(var(--bot) + 52px)}
#rplay{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 4px);z-index:15;width:44px;height:44px;border-radius:var(--t-radius-pill);display:grid;place-items:center;background:var(--t-raised);color:var(--t-accent);border:1px solid var(--t-line);box-shadow:var(--t-shadow)}
#rplay .ic{width:20px;height:20px;fill:currentColor;stroke:none}
#rd:not(.plain) #rplay,#rd[data-mode="listen"] #rplay{display:none}
#rd[data-chapters="1"] .where{display:none}

/* ---------- the big card: the word, how it sounds, what it means here (a solid page; shown and gone at once) ---------- */
#card{position:absolute;inset:0;z-index:80;background:var(--bk-bg);transition:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vh;padding:calc(var(--top) + 28px) calc(var(--sr) + 26px) calc(var(--bot) + 64px) calc(var(--sl) + 26px);overflow:hidden}
#card .word{font:700 clamp(34px,min(13vw,20vh),112px)/1.08 var(--t-font-serif);overflow-wrap:anywhere;max-width:100%}
#card .ipa{font:400 clamp(17px,min(5vw,8vh),34px)/1.2 var(--ui);color:var(--bk-muted)}
#card .zh{font:500 clamp(22px,min(8.5vw,12vh),64px)/1.3 var(--zh);max-width:100%;overflow-wrap:anywhere}
#card.sentence .word{font-size:clamp(21px,6vw,44px);font-weight:600;line-height:1.35;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#card.sentence .zh{font-size:clamp(18px,4.8vw,34px);color:var(--bk-muted);max-height:26vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#card.sentence{justify-content:safe center;gap:2vh}
#card .said{font:400 var(--t-size-body)/1.5 var(--ui);color:var(--bk-muted);max-width:34em;max-height:22vh;min-height:3em;flex:none;overflow:auto}
#card .hint{position:absolute;left:0;right:0;bottom:calc(var(--bot) + 26px);font:500 var(--t-size-caption)/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--bk-muted)}
#card .wait{position:absolute;left:0;bottom:0;height:3px;background:var(--t-accent);width:100%;transform-origin:left center;transform:scaleX(0)}
#card .wait.run{animation:wait linear forwards}
@keyframes wait{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* the small card */
#small{position:absolute;left:10px;right:10px;bottom:calc(var(--bot) + 10px);z-index:80;background:var(--t-raised);color:var(--t-text);transition:none;border:1px solid var(--t-line);border-radius:var(--t-radius-card);box-shadow:var(--t-shadow);padding:16px 18px 14px;max-width:560px;margin:0 auto}
#small .word{font:700 26px/1.15 var(--t-font-serif);overflow-wrap:anywhere}
#small .ipa{color:var(--t-muted);font-size:var(--t-size-footnote);margin-top:2px}
#small .zh{font:500 20px/1.35 var(--zh);margin-top:8px}
#small .said{font-size:var(--t-size-footnote);line-height:1.45;color:var(--t-muted);margin-top:8px;max-height:20vh;overflow:auto}
#small .row{display:flex;gap:8px;margin-top:14px}
#small .row button{flex:1;min-height:var(--t-control);border-radius:var(--t-radius-control);border:1px solid var(--t-line-strong);background:var(--t-raised);font:var(--t-weight-button) var(--t-size-button)/1 var(--ui);display:inline-flex;align-items:center;justify-content:center}
#small .row .know{background:var(--t-accent);color:var(--t-accent-text);border-color:var(--t-accent)}
#small .row .x{flex:none;width:var(--t-control)}
#caption{position:absolute;left:14px;right:14px;bottom:calc(var(--bot) + 104px);z-index:30;margin:0 auto;max-width:600px;background:var(--t-raised);border:1px solid var(--t-line);border-radius:var(--t-radius-control);padding:10px 14px;font:400 var(--t-size-footnote)/1.45 var(--ui);color:var(--t-text);box-shadow:var(--t-shadow);max-height:24vh;overflow:auto}

/* ---------- sheets ---------- */
.veil{position:absolute;inset:0;z-index:60;background:transparent}
.veil.dim{background:var(--t-scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:76%;display:flex;flex-direction:column;background:var(--t-raised);color:var(--t-text);border-radius:var(--t-radius-card) var(--t-radius-card) 0 0;border-top:1px solid var(--t-line);box-shadow:0 -12px 32px -16px rgba(0,0,0,.4);padding:8px 0 calc(var(--bot) + 10px);max-width:680px;margin:0 auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--t-faint);margin:2px auto 8px;flex:none;opacity:.6}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px var(--t-space-l) 6px}
:is(.sheet,#set) h4{font:600 var(--t-size-caption)/1.2 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--t-muted);margin:var(--t-space-xl) 0 var(--t-space-s)}
:is(.sheet,#set) h4:first-child{margin-top:6px}
:is(.sheet,#set) p.note{font-size:var(--t-size-footnote);line-height:1.45;color:var(--t-muted);margin:var(--t-space-s) 0 0}
:is(.sheet,#set) p.warn{font-size:var(--t-size-footnote);line-height:1.4;color:var(--t-off);margin:10px 0 6px}
.swatches{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.sw{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 var(--t-size-caption)/1 var(--ui);color:var(--t-muted)}
.sw i{width:46px;height:46px;border-radius:23px;border:1px solid rgba(128,128,128,.4);display:grid;place-items:center;font:600 17px/1 var(--t-font-serif);font-style:normal}
.sw.on i{box-shadow:0 0 0 2px var(--t-raised),0 0 0 4px var(--t-accent)}
.sw.on{color:var(--t-text)}

.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:var(--t-control-main);border-radius:var(--t-radius-control);border:1px solid var(--t-line-strong);background:var(--t-raised);font:var(--t-weight-button) var(--t-size-button)/1 var(--ui);margin-top:10px}
.big.go{background:var(--t-accent);color:var(--t-accent-text);border-color:var(--t-accent)}

#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--top) + 14px);z-index:95;max-width:calc(100% - 32px);background:var(--t-text);color:var(--t-bg);font:500 var(--t-size-footnote)/1.35 var(--ui);padding:10px 16px;border-radius:var(--t-radius-control);text-align:center;box-shadow:var(--t-shadow)}

#words input,#words select{flex:1 1 100%;min-width:0;min-height:var(--t-control);border-radius:var(--t-radius-control);border:1px solid var(--t-line);background:var(--t-sunken);color:var(--t-text);font:400 var(--t-size-body)/1.2 var(--ui);padding:0 var(--t-space-m);-webkit-appearance:none;appearance:none}

#words .knowbox{background:var(--t-raised);border:1px solid var(--t-line);border-radius:var(--t-radius-card);padding:var(--t-space-l);margin:var(--t-space-xs) 0 var(--t-space-l)}

#words .bar{height:6px;border-radius:3px;background:var(--t-line);overflow:hidden;display:flex;margin:6px 0 4px}

</style></head>
<body>
<div id="lib"><div class="wrap">
  <div class="mast"><span class="mark"><b>I Know</b> Book</span></div>
  <div id="empty" hidden>
    <h1>Read with your tutor</h1>
    <p>Open a book, a PDF or a text. Read it, or let it be read to you. Tap any word and your tutor explains it.</p>
    <div class="acts"><button class="pill go" id="e-file">Open a book</button><button class="pill quiet" id="e-paste">Paste a text</button><button class="pill quiet" id="e-sample">Try a short story</button></div>
  </div>
  <section id="hero" hidden></section>
  <section id="shelf" hidden><h3 class="sec">My books</h3><div id="grid"></div></section>
  <p id="lib-msg"></p>
  <input id="file" type="file" hidden accept=".epub,.pdf,.txt,.md,.markdown,.text,application/epub+zip,application/pdf,text/plain,text/markdown">
</div></div>

<div id="words" hidden><div class="wrap" id="words-body"></div></div>
<div id="set" hidden><div class="wrap"><h1 class="page">Settings</h1><div class="body" id="set-body"></div></div></div>
<nav id="tabs" aria-label="I Know Book"><button id="tab-books" data-tab="books" class="on" aria-selected="true"></button><button id="tab-words" data-tab="words" aria-selected="false"></button><button id="tab-settings" data-tab="settings" aria-selected="false"></button></nav>

<div id="rd" class="plain" data-mode="read" hidden>
  <div id="head"><span id="head-t"></span></div>
  <div id="page"><div id="flow"></div></div>
  <div id="foot"><span id="foot-l"></span><span id="foot-r"></span></div>
  <button id="rplay" aria-label="Play: read the book aloud"></button>
  <div id="mini"><button class="step" id="m-back" aria-label="One sentence back"></button><button class="playbtn" id="m-play" aria-label="Play or pause"></button><button class="step" id="m-fwd" aria-label="One sentence forward"></button></div>
  <header id="top" class="chrome"><button class="round" id="b-lib" aria-label="My books"></button><span class="ttl" id="ttl"></span><button class="round aa" id="b-look" aria-label="Text and colours">A<small>a</small></button><button class="round" id="b-tutor" aria-label="Tutor settings"></button></header>
  <footer id="bar" class="chrome">
    <div class="where"><button class="round" id="c-prev" aria-label="Chapter before"></button><select id="chapters" aria-label="Chapter"></select><button class="round" id="c-next" aria-label="Next chapter"></button></div>
    <div class="transport"><button class="chip" id="t-speed" aria-label="Speed">1.0×</button><button class="step" id="t-back" aria-label="One sentence back"></button><button class="playbtn" id="t-play" aria-label="Play or pause"></button><button class="step" id="t-fwd" aria-label="One sentence forward"></button><button class="chip" id="t-voice" aria-label="Voice">Voice</button></div>
    <div class="seg2" id="modes"><button data-mode="read" class="on" id="mode-read"></button><button data-mode="listen" id="mode-listen"></button></div>
  </footer>
</div>

<div id="caption" hidden></div>
<div id="card" hidden><div class="word"></div><div class="ipa"></div><div class="zh" lang="zh-Hans"></div><div class="said" hidden></div><div class="hint">Tap anywhere = I know</div><div class="wait"></div></div>
<div id="small" hidden><div class="word"></div><div class="ipa"></div><div class="zh" lang="zh-Hans"></div><div class="said" hidden></div><div class="row"><button class="know" data-a="know">I know</button><button data-a="explain">Explain</button><button class="x" data-a="close" aria-label="Close"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div></div>

<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" hidden><div class="grab"></div><div class="body" id="sheet-body"></div></div>
<div id="busy" hidden></div>
<div id="toast" hidden></div>
<script src="book.js"></script>
</body></html>
