<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Read with My tutor</title><link rel="stylesheet" href="pages.css">
<style>
body.day{--bg:#f7f4ec;--bg-elevated:#fffdf7;--bg-hover:#ece7da;--bg-sunken:#efeadd;--fg:#22201c;--fg-muted:#6b665c;--fg-faint:#8d877b;--border:rgba(0,0,0,.1);--border-strong:rgba(0,0,0,.24);
  --accent:#9a5b1e;--accent-fg:#fff;--accent-soft:rgba(154,91,30,.14);--hl-unknown:#0b57d0;--hl-learning:#c98a00;--danger:#b3261e;color-scheme:light}
body{--read-size:21px;font-size:16px}
/* hidden means not on the screen, whatever display a rule gives the thing (#open has display:flex) */
[hidden]{display:none !important}
main{padding:10px 12px 60px}
button,input[type=file]{min-height:44px;font-size:16px}
#open{display:flex;flex-direction:column;gap:12px;max-width:640px;margin-left:auto;margin-right:auto}
#open .note{color:var(--fg-muted);font-size:15px;margin:0}
#file{width:100%;padding:10px}
#paste{width:100%;min-height:140px;background:var(--bg-sunken);color:var(--fg);border:1px solid var(--border-strong);border-radius:8px;padding:8px;font:inherit}
#paste-title{flex:1;min-width:0;min-height:44px}
#paste-go{min-height:48px}
#shelf-box{max-width:640px;margin-left:auto;margin-right:auto}
#shelf{display:flex;flex-direction:column;gap:8px}
.book{display:flex;align-items:stretch;gap:8px}
.book .go{flex:1;min-width:0;text-align:left;min-height:64px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;justify-content:center}
.book .go b{font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.book .go span{color:var(--fg-muted);font-size:14px}
.book .rm{min-width:64px}
#bar{position:sticky;top:0;display:flex;gap:8px;align-items:center;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--border);z-index:2}
#play{min-height:60px;min-width:108px;font-size:18px}
#back,#look{min-height:48px;min-width:48px}
#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#counter{font-size:12px;color:var(--fg-muted)}
#text{font-family:var(--font-serif);font-size:var(--read-size);line-height:1.55;word-spacing:-0.07em;max-width:33em;margin:8px auto 0;padding-bottom:24px;overflow-wrap:break-word}
#text p{margin:0 0 1em;font:inherit}
#text p.h1,#text p.h2,#text p.h3{font-weight:700;line-height:1.3;margin-top:1.2em}
#text p.h1{font-size:1.35em} #text p.h2{font-size:1.2em} #text p.h3{font-size:1.08em}
#text p.li{padding-left:1.2em} #text p.blockquote{padding-left:1em;border-left:3px solid var(--border-strong);color:var(--fg-muted)}
.s{border-radius:4px}
.s.cur{background:var(--accent-soft)}
.s.again{outline:2px solid var(--accent)}
.w{cursor:pointer;border-radius:3px}
.w.hard{-webkit-text-decoration-line:underline;text-decoration-line:underline;-webkit-text-decoration-style:dotted;text-decoration-style:dotted;-webkit-text-decoration-color:var(--hl-unknown);text-decoration-color:var(--hl-unknown);text-decoration-thickness:2px;text-underline-offset:.22em}
.w.learning{-webkit-text-decoration-line:underline;text-decoration-line:underline;-webkit-text-decoration-style:solid;text-decoration-style:solid;-webkit-text-decoration-color:var(--hl-learning);text-decoration-color:var(--hl-learning);text-decoration-thickness:2px;text-underline-offset:.22em;background:rgba(255,214,102,.24)}
.w.cur-w{-webkit-text-decoration-line:underline;text-decoration-line:underline;-webkit-text-decoration-color:var(--accent);text-decoration-color:var(--accent);text-decoration-thickness:3px}
#chapnav{max-width:34em;margin:8px auto 40vh;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#chapnav button{min-height:52px;flex:1;min-width:130px}
#chapnav select{min-height:48px;flex:2;min-width:0;max-width:100%;font-size:16px}
#chapnav[hidden]{display:none}
#say{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:var(--bg-elevated);border-top:1px solid var(--border-strong);padding:12px 16px;font:16px/1.55 var(--font-sans)}
</style></head>
<body><main>
<section id="open">
  <h1>Read</h1>
  <p class="note">Open a book or a text: an EPUB e-book, a PDF, a text file, or paste a text. Tap a word to see what it means.</p>
  <input id="file" type="file" accept=".epub,.pdf,.txt,.md,.markdown,.text,application/epub+zip,application/pdf,text/plain,text/markdown">
  <p class="note" id="locked-note">Books bought in Kindle or Apple Books are locked and cannot be opened.</p>
  <span class="msg bad" id="open-msg"></span>
  <textarea id="paste" placeholder="Or paste a text here"></textarea>
  <div class="row"><input id="paste-title" type="text" placeholder="Its title"><button id="paste-go" class="primary">Read this text</button></div>
</section>
<section id="shelf-box" hidden>
  <h2>My books</h2>
  <div id="shelf"></div>
</section>
<section id="reader" hidden>
  <div id="bar"><button id="back" aria-label="My books">&#8249; Books</button><button id="play" class="primary">&#9654; Play</button><span id="title"></span><span id="counter" title="Stops made / sentences so far"></span><button id="look" aria-label="Day or night">&#9728;</button></div>
  <div id="text"></div>
  <div id="chapnav" hidden><button id="chap-prev">&#8249; Previous chapter</button><select id="chapters" aria-label="Chapter"></select><button id="chap-next">Next chapter &#8250;</button></div>
</section>
</main><div id="say" hidden></div><script src="reader.js"></script></body></html>
