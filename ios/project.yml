name: YTLearn
options:
  bundleIdPrefix: local.ytlearn
  xcodeVersion: "14.3"   # keeps the project file readable by Xcode 14 and 15
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  YTLearn:
    type: application
    platform: iOS
    sources:
      - path: YTLearn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ytlearn.app
        PRODUCT_NAME: YTLearn
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "YT Learn"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone is used only while a paused video is waiting for you to say “let's go”."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition is used to hear “let's go” so the video can play again."
