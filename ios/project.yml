name: YTLearn
options:
  bundleIdPrefix: local.ytlearn
  xcodeVersion: "14.3"   # keeps the project file readable by Xcode 14 and 15
  deploymentTarget:
    iOS: "16.4"   # My tutor needs Safari 16.4's JavaScript (DecompressionStream for its dictionary)
  createIntermediateGroups: true
targets:
  YTLearn:
    type: application
    platform: iOS
    sources:
      - path: YTLearn
        excludes:
          - "Web/**"
          - "Info.plist"
      # My tutor's own files, kept in their folders (ytlearn://app/dream/… : the dictionary, settings, My Vocabulary)
      - path: YTLearn/Web
        type: folder
    info:
      path: YTLearn/Info.plist
      properties:
        UIBackgroundModes: [audio]   # the tutor keeps talking with the screen off
        UIFileSharingEnabled: true   # the vocabulary file shows in the Files app (On My iPhone ▸ YT Learn)
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleURLTypes:            # "Open this link in I Know": iknow://open?url=<the address, percent-encoded>
          - CFBundleURLName: local.ytlearn.app.open
            CFBundleURLSchemes: [iknow]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.ytlearn.app
        PRODUCT_NAME: YTLearn
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "3.10"
        CURRENT_PROJECT_VERSION: "40"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "I Know"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "The microphone is used only while My tutor waits for your answer (I know, a question, a call, voice mode) or a paused video waits for “let's go”."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech recognition writes down what you say to My tutor (questions, I know / I don't know, “let's go”), on the iPhone when it can."
