<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>I Know Book</title>
<style>
/* I Know Book. One calm page: the text, and nothing else until it is asked for. Colours and text settings come from
   book-look.ts as CSS variables on <html>. Everything that is "hidden" is really not on the screen. */
:root{--bk-bg:#FAF6EC;--bk-fg:#23201A;--bk-muted:#7d776c;--bk-faint:#b3ad9f;--bk-line:#e6e0d2;--bk-soft:#f1ecdf;--bk-raised:#fffdf7;--bk-accent:#9A5B1E;--bk-accent-soft:#eadfce;--bk-hard:#2A62B8;--bk-learning:#B07A00;--bk-on-accent:#fff;
  --bk-font:ui-serif,Georgia,serif;--bk-size:20px;--bk-line-height:1.5;--bk-margin:24px;--bk-letter:0em;--bk-word:0em;--bk-para:.7em;--bk-align:left;--bk-weight:400;
  --ui:system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--zh:"PingFang SC","Noto Sans SC",system-ui,sans-serif;
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);--col:300px;--gap:48px;--shift:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;height:100%;background:var(--bk-bg);color:var(--bk-fg);font-family:var(--ui);-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none}
body{overflow:hidden;position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none}
button:disabled{opacity:.35}
svg{display:block}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- the library ---------- */
#lib{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--top) + 18px) calc(var(--sr) + 22px) calc(var(--bot) + 40px) calc(var(--sl) + 22px)}
#lib .wrap{max-width:820px;margin:0 auto}
.mast{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.mark{font:600 13px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--bk-muted)}
.mark b{color:var(--bk-fg);font-weight:700}
.round{width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:var(--bk-muted)}
.round:active{background:var(--bk-soft)}
#hero{display:flex;gap:20px;align-items:stretch;padding:0 0 28px;margin-bottom:26px;border-bottom:1px solid var(--bk-line)}
#hero .cover{flex:none;width:118px}
#hero .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px}
#hero .eyebrow{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--bk-accent)}
#hero h2{margin:0;font:600 24px/1.2 ui-serif,Georgia,serif;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
#hero .by{color:var(--bk-muted);font-size:14px}
#hero .acts{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.pill{min-height:46px;padding:0 20px;border-radius:23px;font:600 16px/1 var(--ui);display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bk-line);color:var(--bk-fg);background:var(--bk-raised)}
.pill.go{background:var(--bk-fg);color:var(--bk-bg);border-color:var(--bk-fg)}
.pill:active{opacity:.7}
.pill .ic{width:18px;height:18px}
.bar-prog{height:3px;border-radius:2px;background:var(--bk-line);overflow:hidden;margin-top:6px}
.bar-prog i{display:block;height:100%;background:var(--bk-accent);border-radius:2px}
h3.sec{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--bk-muted);margin:0 0 16px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:26px 20px}
.tile{display:flex;flex-direction:column;gap:9px;text-align:left;min-width:0}
.tile .t{font:500 14px/1.3 var(--ui);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .p{font-size:12px;color:var(--bk-muted)}
.cover{aspect-ratio:2/3;border-radius:4px 7px 7px 4px;position:relative;overflow:hidden;box-shadow:0 1px 1px rgba(0,0,0,.14),0 10px 22px -10px rgba(0,0,0,.42);display:flex;flex-direction:column;justify-content:space-between;padding:17% 15% 15% 19%;color:#fff}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:linear-gradient(90deg,rgba(0,0,0,.28),rgba(0,0,0,0))}
.cover::after{content:"";position:absolute;inset:7% 7% 7% 11%;border:1px solid rgba(255,255,255,.28);border-radius:2px;pointer-events:none}
.cover .ct{font:600 12.5px/1.22 ui-serif,Georgia,serif;letter-spacing:.01em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;position:relative}
.cover .ca{font:500 8.5px/1.2 var(--ui);letter-spacing:.14em;text-transform:uppercase;opacity:.8;position:relative;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#hero .cover .ct{font-size:14px}
.tile.add .cover{background:transparent;box-shadow:none;border:1.5px dashed var(--bk-faint);color:var(--bk-muted);align-items:center;justify-content:center;padding:0}
.tile.add .cover::before,.tile.add .cover::after{display:none}
.tile.add .ic{width:30px;height:30px}
#empty{text-align:center;padding:9vh 8px 0;max-width:420px;margin:0 auto}
#empty h1{font:600 30px/1.2 ui-serif,Georgia,serif;margin:0 0 12px}
#empty p{color:var(--bk-muted);font-size:16px;line-height:1.5;margin:0 0 26px}
#empty .acts{display:flex;flex-direction:column;gap:12px;align-items:stretch}
#empty .pill{justify-content:center;min-height:52px}
#lib-msg{color:#b3261e;font-size:14px;margin:14px 0 0;min-height:1em}

/* ---------- the reading page ---------- */
#rd{position:absolute;inset:0}
#page{position:absolute;left:var(--sl);right:var(--sr);top:calc(var(--top) + 30px);bottom:calc(var(--bot) + 30px);overflow:hidden;touch-action:pan-y}
/* Listening: the small player sits under the text, never on it */
#rd[data-mode="listen"] #page{bottom:calc(var(--bot) + 110px)}
#flow{height:100%;width:var(--col);margin:0 auto;column-width:var(--col);column-gap:var(--gap);column-fill:auto;transform:translate3d(var(--shift),0,0);transition:transform .28s cubic-bezier(.2,.7,.2,1);
  font-family:var(--bk-font);font-size:var(--bk-size);line-height:var(--bk-line-height);letter-spacing:var(--bk-letter);word-spacing:var(--bk-word);text-align:var(--bk-align);font-weight:var(--bk-weight);
  -webkit-hyphens:manual;hyphens:manual;overflow-wrap:break-word;-webkit-user-select:text;user-select:text;orphans:2;widows:2;font-kerning:normal;text-rendering:optimizeLegibility}
#flow.jump{transition:none}
html[data-align="justify"] #flow{-webkit-hyphens:auto;hyphens:auto}
#flow p{margin:0 0 var(--bk-para)}
#flow p.h1,#flow p.h2,#flow p.h3{font-weight:700;line-height:1.25;text-align:left;break-after:avoid;-webkit-column-break-after:avoid;margin:.9em 0 .6em}
#flow p.h1{font-size:1.45em;margin-top:0} #flow p.h2{font-size:1.22em} #flow p.h3{font-size:1.08em}
#flow p.li{padding-left:1.1em} #flow p.blockquote{padding-left:1em;border-left:2px solid var(--bk-line);color:var(--bk-muted)}
#flow .chap{font:600 .62em/1.2 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--bk-muted);margin:0 0 1.6em;text-align:left;break-after:avoid;-webkit-column-break-after:avoid}
.s{border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s.cur{background:var(--bk-accent-soft)}
.w{border-radius:3px}
.w.hard{text-decoration:underline dotted;-webkit-text-decoration:underline dotted;text-decoration-color:color-mix(in srgb,var(--bk-hard) 55%,transparent);-webkit-text-decoration-color:color-mix(in srgb,var(--bk-hard) 55%,transparent);text-decoration-thickness:1px;text-underline-offset:.26em}
.w.learning{text-decoration:underline solid;-webkit-text-decoration:underline solid;text-decoration-color:color-mix(in srgb,var(--bk-learning) 80%,transparent);-webkit-text-decoration-color:color-mix(in srgb,var(--bk-learning) 80%,transparent);text-decoration-thickness:1.5px;text-underline-offset:.26em}
html[data-marks="0"] .w.hard,html[data-marks="0"] .w.learning{text-decoration:none;-webkit-text-decoration:none}
.w.pick{background:var(--bk-accent-soft)}
#foot{position:absolute;left:var(--sl);right:var(--sr);bottom:calc(var(--bot) + 6px);height:20px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--bk-margin);font:500 11px/1 var(--ui);letter-spacing:.06em;color:var(--bk-faint);pointer-events:none}
#head{position:absolute;left:var(--sl);right:var(--sr);top:calc(var(--top) + 6px);height:20px;display:flex;align-items:center;justify-content:center;padding:0 var(--bk-margin);font:500 11px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:var(--bk-faint);pointer-events:none;white-space:nowrap;overflow:hidden}
#head span{overflow:hidden;text-overflow:ellipsis}

/* the bars that come when the middle of the page is tapped */
.chrome{position:absolute;left:0;right:0;z-index:20;background:color-mix(in srgb,var(--bk-bg) 97%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);transition:transform .26s cubic-bezier(.2,.7,.2,1),opacity .2s}
#top{top:0;padding:calc(var(--top) + 4px) calc(var(--sr) + 8px) 4px calc(var(--sl) + 8px);display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--bk-line)}
#top .ttl{flex:1;min-width:0;text-align:center;font:600 15px/1.2 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
#top .aa{font:600 20px/1 ui-serif,Georgia,serif;display:inline-flex;align-items:baseline;justify-content:center;padding-top:11px}
#top .aa small{font-size:14px}
#bar{bottom:0;padding:10px calc(var(--sr) + 16px) calc(var(--bot) + 10px) calc(var(--sl) + 16px);border-top:1px solid var(--bk-line);display:flex;flex-direction:column;gap:12px}
#rd.plain #top{transform:translateY(-105%);opacity:0;pointer-events:none}
#rd.plain #bar{transform:translateY(105%);opacity:0;pointer-events:none}
.where{display:flex;align-items:center;gap:6px}
.where select{flex:1;min-width:0;height:44px;border:0;background:transparent;color:var(--bk-fg);font:500 15px/1 var(--ui);text-align:center;text-align-last:center;-webkit-appearance:none;appearance:none}
.seg2{display:grid;grid-template-columns:1fr 1fr;background:var(--bk-soft);border-radius:14px;padding:3px;gap:3px}
.seg2 button{min-height:44px;border-radius:11px;font:600 15px/1 var(--ui);color:var(--bk-muted);display:flex;align-items:center;justify-content:center;gap:8px}
.seg2 button.on{background:var(--bk-raised);color:var(--bk-fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg2 .ic{width:18px;height:18px}
.transport{display:flex;align-items:center;justify-content:center;gap:8px}
.transport .chip{min-width:62px;min-height:44px;padding:0 12px;border-radius:22px;border:1px solid var(--bk-line);font:600 14px/1 var(--ui);color:var(--bk-fg);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}
.transport .chip{flex:none}
.transport #t-voice{display:block;line-height:42px;min-width:62px;flex:0 1 96px}
@media (max-width:340px){#bar{padding-left:calc(var(--sl) + 10px);padding-right:calc(var(--sr) + 10px)}.transport{gap:4px}.transport .step{width:44px;height:44px}.transport .playbtn{width:58px;height:58px}.transport .chip{min-width:54px;padding:0 8px;font-size:13px}.transport #t-voice{min-width:70px;flex-basis:84px}}
.transport .step{flex:none;width:48px;height:48px;border-radius:24px;display:grid;place-items:center;color:var(--bk-fg)}
.transport .playbtn{flex:none}
.transport .step:active,.transport .chip:active{background:var(--bk-soft)}
.playbtn{width:66px;height:66px;border-radius:33px;background:var(--bk-fg);color:var(--bk-bg);display:grid;place-items:center;flex:none}
.playbtn:active{transform:scale(.96)}
.playbtn .ic{width:28px;height:28px;fill:currentColor;stroke:none}
/* listening with the bars away: one small player stays under the thumb */
#mini{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 30px);z-index:15;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:40px;background:color-mix(in srgb,var(--bk-raised) 88%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid var(--bk-line);box-shadow:0 8px 24px -10px rgba(0,0,0,.35)}
#mini .step{width:46px;height:46px;border-radius:23px;display:grid;place-items:center}
#mini .playbtn{width:56px;height:56px}
#rd:not(.plain) #mini,#rd[data-mode="read"] #mini{display:none}
#rd[data-mode="read"] .transport{display:none}
#rd[data-chapters="1"] .where{display:none}

/* ---------- the big card: the word, how it sounds, what it means here ---------- */
#card{position:absolute;inset:0;z-index:80;background:var(--bk-bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:3vh;padding:calc(var(--top) + 28px) calc(var(--sr) + 26px) calc(var(--bot) + 64px) calc(var(--sl) + 26px);overflow:hidden}
#card .word{font:700 clamp(34px,min(13vw,20vh),112px)/1.08 ui-serif,Georgia,serif;overflow-wrap:anywhere;max-width:100%}
#card .ipa{font:400 clamp(16px,min(5vw,8vh),34px)/1.2 var(--ui);color:var(--bk-muted)}
#card .zh{font:500 clamp(22px,min(8.5vw,12vh),64px)/1.3 var(--zh);max-width:100%;overflow-wrap:anywhere}
#card.sentence .word{font-size:clamp(21px,6vw,44px);font-weight:600;line-height:1.35;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#card.sentence .zh{font-size:clamp(18px,4.8vw,34px);color:var(--bk-muted);max-height:26vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
#card.sentence{justify-content:safe center;gap:2vh}
#card .said{font:400 15px/1.5 var(--ui);color:var(--bk-muted);max-width:34em;max-height:22vh;min-height:3em;flex:none;overflow:auto}
#card .hint{position:absolute;left:0;right:0;bottom:calc(var(--bot) + 26px);font:500 12px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--bk-faint)}
#card .wait{position:absolute;left:0;bottom:0;height:3px;background:var(--bk-accent);width:100%;transform-origin:left center;transform:scaleX(0)}
#card .wait.run{animation:wait linear forwards}
@keyframes wait{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* the small card */
#small{position:absolute;left:10px;right:10px;bottom:calc(var(--bot) + 10px);z-index:80;background:var(--bk-raised);border:1px solid var(--bk-line);border-radius:20px;box-shadow:0 18px 40px -16px rgba(0,0,0,.45);padding:16px 18px 14px;max-width:560px;margin:0 auto}
#small .word{font:700 26px/1.15 ui-serif,Georgia,serif;overflow-wrap:anywhere}
#small .ipa{color:var(--bk-muted);font-size:15px;margin-top:2px}
#small .zh{font:500 20px/1.35 var(--zh);margin-top:8px}
#small .said{font-size:14px;line-height:1.45;color:var(--bk-muted);margin-top:8px;max-height:20vh;overflow:auto}
#small .row{display:flex;gap:8px;margin-top:14px}
#small .row button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--bk-line);font:600 15px/1 var(--ui)}
#small .row .know{background:var(--bk-fg);color:var(--bk-bg);border-color:var(--bk-fg)}
#small .row .x{flex:none;width:46px}
#caption{position:absolute;left:14px;right:14px;bottom:calc(var(--bot) + 104px);z-index:30;margin:0 auto;max-width:600px;background:color-mix(in srgb,var(--bk-raised) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--bk-line);border-radius:14px;padding:10px 14px;font:400 14px/1.45 var(--ui);color:var(--bk-fg);max-height:24vh;overflow:auto}

/* ---------- sheets ---------- */
.veil{position:absolute;inset:0;z-index:60;background:transparent}
.veil.dim{background:rgba(0,0,0,.28)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-height:76%;display:flex;flex-direction:column;background:var(--bk-raised);border-radius:22px 22px 0 0;border-top:1px solid var(--bk-line);box-shadow:0 -18px 44px -22px rgba(0,0,0,.5);padding:8px 0 calc(var(--bot) + 10px);max-width:680px;margin:0 auto}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:var(--bk-faint);margin:2px auto 8px;flex:none;opacity:.6}
.sheet .body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 20px 6px}
.sheet h4{font:600 11px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--bk-muted);margin:18px 0 10px}
.sheet h4:first-child{margin-top:6px}
.sheet p.note{font-size:13px;line-height:1.45;color:var(--bk-muted);margin:8px 0 0}
.sheet p.warn{font-size:14px;line-height:1.4;color:#b3261e;margin:10px 0 6px}
.swatches{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.sw{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;font:500 11px/1 var(--ui);color:var(--bk-muted)}
.sw i{width:46px;height:46px;border-radius:23px;border:1px solid rgba(128,128,128,.4);display:grid;place-items:center;font:600 17px/1 ui-serif,Georgia,serif;font-style:normal}
.sw.on i{box-shadow:0 0 0 2px var(--bk-raised),0 0 0 4px var(--bk-accent)}
.sw.on{color:var(--bk-fg)}
.fonts{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.fonts button{flex:none;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--bk-line);font-size:17px;white-space:nowrap}
.fonts button.on{border-color:var(--bk-accent);color:var(--bk-accent);background:var(--bk-accent-soft)}
.ctl{display:grid;grid-template-columns:98px 1fr 52px;align-items:center;gap:10px;min-height:48px}
.ctl label{font:500 15px/1.2 var(--ui)}
.ctl output{font:500 13px/1 var(--ui);color:var(--bk-muted);text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--bk-line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:13px;background:var(--bk-raised);border:1px solid var(--bk-faint);box-shadow:0 2px 6px rgba(0,0,0,.22);margin-top:-11px}
input[type=range]:disabled{opacity:.35}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-height:44px;min-width:52px;padding:0 14px;border-radius:12px;border:1px solid var(--bk-line);font:600 15px/1 var(--ui);color:var(--bk-muted)}
.opts button.on{border-color:var(--bk-accent);color:var(--bk-accent);background:var(--bk-accent-soft)}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:50px}
.rowline>span{font:500 15px/1.3 var(--ui);flex:1;min-width:0}
.rowline .opts{flex:none;flex-wrap:nowrap}
.opts[data-name="learnerLevel"]{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:4px}
.opts[data-name="learnerLevel"] button{min-width:0;padding:0}
.rowline small{display:block;color:var(--bk-muted);font-size:12px;font-weight:400;margin-top:2px}
.colors{display:flex;gap:14px;align-items:center;margin-top:6px}
.colors label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--bk-muted)}
input[type=color]{-webkit-appearance:none;appearance:none;width:46px;height:46px;border-radius:12px;border:1px solid var(--bk-line);padding:3px;background:var(--bk-raised)}
.key{display:flex;gap:8px;margin:8px 0}
.key input,.field{flex:1;min-width:0;min-height:46px;border-radius:12px;border:1px solid var(--bk-line);background:var(--bk-bg);color:var(--bk-fg);font:400 16px/1 var(--ui);padding:0 12px;-webkit-user-select:text;user-select:text}
.key button,.btn{min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--bk-line);font:600 15px/1 var(--ui)}
select.field{-webkit-appearance:none;appearance:none}
textarea.field{min-height:140px;padding:12px;line-height:1.4;width:100%;resize:none}
.big{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;border-radius:14px;border:1px solid var(--bk-line);font:600 16px/1 var(--ui);margin-top:10px}
.big.go{background:var(--bk-fg);color:var(--bk-bg);border-color:var(--bk-fg)}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--top) + 14px);z-index:95;max-width:calc(100% - 32px);background:var(--bk-fg);color:var(--bk-bg);font:500 14px/1.35 var(--ui);padding:10px 16px;border-radius:14px;text-align:center;box-shadow:0 10px 26px -10px rgba(0,0,0,.5)}
#busy{position:absolute;inset:0;z-index:90;display:grid;place-items:center;background:color-mix(in srgb,var(--bk-bg) 80%,transparent);font:500 15px/1.4 var(--ui);color:var(--bk-muted);text-align:center;padding:30px}
@media (prefers-reduced-motion:reduce){#flow,.chrome{transition:none}}
</style></head>
<body>
<div id="lib"><div class="wrap">
  <div class="mast"><span class="mark"><b>I Know</b> Book</span><button class="round" id="lib-set" aria-label="Settings"></button></div>
  <div id="empty" hidden>
    <h1>Read with your tutor</h1>
    <p>Open a book, a PDF or a text. Read it, or let it be read to you. Tap any word and your tutor explains it.</p>
    <div class="acts"><button class="pill go" id="e-file">Open a book or a PDF</button><button class="pill" id="e-paste">Paste a text</button><button class="pill" id="e-sample">Try a short story</button></div>
  </div>
  <section id="hero" hidden></section>
  <section id="shelf" hidden><h3 class="sec">My books</h3><div id="grid"></div></section>
  <p id="lib-msg"></p>
  <input id="file" type="file" hidden accept=".epub,.pdf,.txt,.md,.markdown,.text,application/epub+zip,application/pdf,text/plain,text/markdown">
</div></div>

<div id="rd" class="plain" data-mode="read" hidden>
  <div id="head"><span id="head-t"></span></div>
  <div id="page"><div id="flow"></div></div>
  <div id="foot"><span id="foot-l"></span><span id="foot-r"></span></div>
  <div id="mini"><button class="step" id="m-back" aria-label="One sentence back"></button><button class="playbtn" id="m-play" aria-label="Play or pause"></button><button class="step" id="m-fwd" aria-label="One sentence forward"></button></div>
  <header id="top" class="chrome"><button class="round" id="b-lib" aria-label="My books"></button><span class="ttl" id="ttl"></span><button class="round aa" id="b-look" aria-label="Text and colours">A<small>a</small></button><button class="round" id="b-tutor" aria-label="Tutor settings"></button></header>
  <footer id="bar" class="chrome">
    <div class="where"><button class="round" id="c-prev" aria-label="Chapter before"></button><select id="chapters" aria-label="Chapter"></select><button class="round" id="c-next" aria-label="Next chapter"></button></div>
    <div class="transport"><button class="chip" id="t-speed" aria-label="Speed">1.0×</button><button class="step" id="t-back" aria-label="One sentence back"></button><button class="playbtn" id="t-play" aria-label="Play or pause"></button><button class="step" id="t-fwd" aria-label="One sentence forward"></button><button class="chip" id="t-voice" aria-label="Voice">Voice</button></div>
    <div class="seg2" id="modes"><button data-mode="read" class="on" id="mode-read"></button><button data-mode="listen" id="mode-listen"></button></div>
  </footer>
</div>

<div id="caption" hidden></div>
<div id="card" hidden><div class="word"></div><div class="ipa"></div><div class="zh" lang="zh-Hans"></div><div class="said" hidden></div><div class="hint">Tap anywhere = I know</div><div class="wait"></div></div>
<div id="small" hidden><div class="word"></div><div class="ipa"></div><div class="zh" lang="zh-Hans"></div><div class="said" hidden></div><div class="row"><button class="know" data-a="know">I know</button><button data-a="explain">Explain</button><button class="x" data-a="close" aria-label="Close">&#10005;</button></div></div>

<div class="veil" id="veil" hidden></div>
<div class="sheet" id="sheet" hidden><div class="grab"></div><div class="body" id="sheet-body"></div></div>
<div id="busy" hidden></div>
<div id="toast" hidden></div>
<script src="book.js"></script>
</body></html>
