<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Read with My tutor</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="pages.css">
<style>
/* the reader: colours, fonts, sizes and corners from theme.css (the one look); Day / Night = data-theme on <body> */
body{--read-size:21px}
/* hidden means not on the screen, whatever display a rule gives the thing (#open has display:flex) */
[hidden]{display:none !important}
main{padding:var(--t-space-m) var(--t-space-l) 60px}
input[type=file]{min-height:var(--t-control);font-size:var(--t-size-body)}
#open{display:flex;flex-direction:column;gap:var(--t-space-m);max-width:640px;margin-left:auto;margin-right:auto}
#open .note{color:var(--t-muted);font-size:var(--t-size-footnote);margin:0}
#file{width:100%;padding:10px}
#paste{width:100%;min-height:140px;font:var(--t-size-body)/1.45 var(--t-font-ui)}
#paste-title{flex:1;min-width:0;width:auto}
#paste-go{min-height:var(--t-control-main)}
#shelf-box{max-width:640px;margin-left:auto;margin-right:auto}
#shelf{display:flex;flex-direction:column;gap:var(--t-space-s)}
.book{display:flex;align-items:stretch;gap:var(--t-space-s)}
.book .go{flex:1;min-width:0;text-align:left;min-height:64px;padding:10px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;justify-content:center}
.book .go b{font-size:var(--t-size-body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;max-width:100%}
.book .go span{color:var(--t-muted);font-size:var(--t-size-footnote);font-weight:400}
.book .rm{min-width:64px}
#bar{position:sticky;top:0;display:flex;gap:var(--t-space-s);align-items:center;background:var(--t-bg);padding:var(--t-space-s) 0;border-bottom:1px solid var(--t-line);z-index:2}
#play{min-height:60px;min-width:108px}
#back,#look{min-height:var(--t-control);min-width:var(--t-control)}
#back{padding:0 var(--t-space-m) 0 var(--t-space-s)}
#look{padding:0}
#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#counter{font-size:var(--t-size-caption);color:var(--t-muted)}
#text{font-family:var(--t-font-serif);font-size:var(--read-size);line-height:1.55;word-spacing:-0.07em;max-width:33em;margin:8px auto 0;padding-bottom:24px;overflow-wrap:break-word}
#text p{margin:0 0 1em;font:inherit}
#text p.h1,#text p.h2,#text p.h3{font-weight:700;line-height:1.3;margin-top:1.2em}
#text p.h1{font-size:1.35em} #text p.h2{font-size:1.2em} #text p.h3{font-size:1.08em}
#text p.li{padding-left:1.2em} #text p.blockquote{padding-left:1em;border-left:3px solid var(--t-line-strong);color:var(--t-muted)}
.s{border-radius:4px}
.s.cur{background:var(--t-accent-soft)}
.s.again{outline:2px solid var(--t-accent)}
.w{cursor:pointer;border-radius:3px}
.w.hard{-webkit-text-decoration-line:underline;text-decoration-line:underline;-webkit-text-decoration-style:dotted;text-decoration-style:dotted;-webkit-text-decoration-color:var(--t-hard);text-decoration-color:var(--t-hard);text-decoration-thickness:2px;text-underline-offset:.22em}
.w.learning{-webkit-text-decoration-line:underline;text-decoration-line:underline;-webkit-text-decoration-style:solid;text-decoration-style:solid;-webkit-text-decoration-color:var(--t-learning);text-decoration-color:var(--t-learning);text-decoration-thickness:2px;text-underline-offset:.22em;background:color-mix(in srgb,var(--t-learning) 16%,transparent)}
.w.cur-w{-webkit-text-decoration-line:underline;text-decoration-line:underline;-webkit-text-decoration-color:var(--t-accent);text-decoration-color:var(--t-accent);text-decoration-thickness:3px}
#chapnav{max-width:34em;margin:8px auto 40vh;display:flex;gap:var(--t-space-s);align-items:center;flex-wrap:wrap}
#chapnav button{min-height:var(--t-control-main);flex:1;min-width:130px}
#chapnav select{min-height:var(--t-control);flex:2;min-width:0;width:auto;max-width:100%}
#chapnav[hidden]{display:none}
#say{position:fixed;left:0;right:0;bottom:0;max-height:42vh;overflow:auto;background:var(--t-raised);border-top:1px solid var(--t-line-strong);padding:var(--t-space-m) var(--t-space-l);font:var(--t-size-body)/1.55 var(--t-font-ui);box-shadow:var(--t-shadow)}
</style></head>
<body><main>
<section id="open">
  <h1>Read</h1>
  <p class="note">Open a book or a text: an EPUB e-book, a PDF, a text file, or paste a text. Tap a word to see what it means.</p>
  <input id="file" type="file" accept=".epub,.pdf,.txt,.md,.markdown,.text,application/epub+zip,application/pdf,text/plain,text/markdown">
  <p class="note" id="locked-note">Books bought in Kindle or Apple Books are locked and cannot be opened.</p>
  <span class="msg bad" id="open-msg"></span>
  <textarea id="paste" placeholder="Or paste a text here"></textarea>
  <div class="row"><input id="paste-title" type="text" placeholder="Its title"><button id="paste-go" class="primary">Read this text</button></div>
</section>
<section id="shelf-box" hidden>
  <h2>My books</h2>
  <div id="shelf"></div>
</section>
<section id="reader" hidden>
  <div id="bar"><button id="back" class="quiet" aria-label="My books"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg> Books</button><button id="play" class="primary"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false" style="fill:currentColor;stroke:none"><path d="M8 5.2v13.6l11-6.8z"/></svg> Play</button><span id="title"></span><span id="counter" title="Stops made / sentences so far"></span><button id="look" class="quiet" aria-label="Day or night"></button></div>
  <div id="text"></div>
  <div id="chapnav" hidden><button id="chap-prev"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5l-7 7 7 7"/></svg> Previous chapter</button><select id="chapters" aria-label="Chapter"></select><button id="chap-next">Next chapter <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg></button></div>
</section>
</main><div id="say" hidden></div><script src="reader.js"></script></body></html>
