<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 14px; width: 300px; font: 13px system-ui, sans-serif; color: #202124; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .mode { display: flex; border: 1px solid #dadce0; border-radius: 8px; overflow: hidden; margin-bottom: 10px; }
  .mode label { flex: 1; text-align: center; padding: 8px 0; cursor: pointer; font-weight: 600; background: #f8f9fa; }
  .mode input { display: none; }
  .mode input:checked + span { display: block; }
  .mode label.on-claude { background: #d97757; color: #fff; }
  .mode label.on-chatgpt { background: #10a37f; color: #fff; }
  #go { width: 100%; padding: 10px 0; font-size: 14px; border-radius: 8px; border: 0; color: #fff; cursor: pointer; background: #d97757; }
  #go.chatgpt { background: #10a37f; }
  #go:disabled { opacity: .6; cursor: default; }
  .hint { font-size: 11px; color: #5f6368; margin-top: 6px; }
  .opt { display: block; margin-top: 10px; font-size: 12px; line-height: 1.35; }
  select { width: 100%; margin-top: 4px; padding: 5px; font-size: 12px; }
  hr { border: 0; border-top: 1px solid #e8eaed; margin: 12px 0 2px; }
  #msg { margin-top: 10px; font-size: 12px; color: #5f6368; word-break: break-word; }
  #msg.err { color: #d93025; }
</style>
<h1>YouTube → AI chat</h1>
<div class="mode" id="mode">
  <label id="lbl-claude"><input type="radio" name="target" value="claude">Claude</label>
  <label id="lbl-chatgpt"><input type="radio" name="target" value="chatgpt">ChatGPT</label>
</div>
<button id="go">Send this video to Claude</button>
<div class="hint">Sends the video link + full transcript. Pauses go to the same chat.</div>
<hr>
<label class="opt"><input type="checkbox" id="pauseOn" checked> When I pause: show the last ~30 s big and send them to the chat</label>
<label class="opt"><input type="checkbox" id="sendTranscript" checked> First time for a video: also send the link + full transcript</label>
<label class="opt"><input type="checkbox" id="replayOn" checked> Replay those sentences once, slowly</label>
<label class="opt">Replay speed
  <select id="slowRate">
    <option value="1">100% (normal)</option>
    <option value="0.85">85%</option>
    <option value="0.7">70% (slow)</option>
    <option value="0.5">50% (very slow)</option>
  </select>
</label>
<label class="opt"><input type="checkbox" id="voiceOn" checked> Say “bye bye” to go back to the start of that part and keep playing (or press Enter)</label>
<label class="opt">Text size on the video
  <select id="textSize">
    <option value="s">Small</option>
    <option value="m">Medium</option>
    <option value="l">Large</option>
    <option value="xl">Extra large</option>
    <option value="auto">Auto (fills the screen)</option>
  </select>
</label>
<div id="msg"></div>
<script src="popup.js"></script>
