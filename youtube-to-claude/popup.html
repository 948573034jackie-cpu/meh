<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 14px; width: 280px; font: 13px system-ui, sans-serif; color: #202124; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  .two { display: flex; gap: 8px; }
  .two button { flex: 1; }
  .hint { font-size: 11px; color: #5f6368; margin-top: 6px; }
  .opt label { display: inline-block; margin-right: 14px; margin-top: 4px; }
  .chatgpt { background: #10a37f !important; }
  button { padding: 10px 0; font-size: 14px; border-radius: 8px; border: 0; background: #d97757; color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .opt { display: block; margin-top: 10px; font-size: 12px; line-height: 1.35; }
  select { width: 100%; margin-top: 4px; padding: 5px; font-size: 12px; }
  #msg { margin-top: 10px; font-size: 12px; color: #5f6368; word-break: break-word; }
  #msg.err { color: #d93025; }
</style>
<h1>YouTube → Claude / ChatGPT</h1>
<div class="two">
  <button id="goclaude" class="go claude">Send to Claude</button>
  <button id="gochatgpt" class="go chatgpt">Send to ChatGPT</button>
</div>
<div class="hint">Sends the video link + full transcript.</div>
<div class="opt"><b>When I pause a video, send the sentences to:</b>
  <label><input type="radio" name="target" value="claude"> Claude</label>
  <label><input type="radio" name="target" value="chatgpt"> ChatGPT</label>
</div>
<label class="opt"><input type="checkbox" id="pauseOn" checked> When I pause the video: show the last sentences big &amp; send them to the chat</label>
<label class="opt"><input type="checkbox" id="sendTranscript" checked> The first time for a video, also send the link + full transcript</label>
<label class="opt"><input type="checkbox" id="replayOn" checked> Also replay those sentences once</label>
<label class="opt">Text size on the video:
  <select id="textSize">
    <option value="auto">Auto (as big as fits everything)</option>
    <option value="l">Large</option>
    <option value="xl">Extra large</option>
    <option value="xxl">Huge</option>
    <option value="max">Giant (scrolls to the current sentence)</option>
  </select>
</label>
<div id="msg"></div>
<script src="popup.js"></script>
