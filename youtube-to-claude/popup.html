<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 14px; width: 300px; font: 13px system-ui, sans-serif; color: #202124; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  p { margin: 0 0 10px; line-height: 1.4; }
  .row { display: flex; gap: 6px; margin: 6px 0; }
  .row button { flex: 1; padding: 8px 4px; font-size: 12px; border-radius: 8px; border: 1px solid #dadce0; background: #f8f9fa; cursor: pointer; }
  .row button.primary { background: #1e8e3e; color: #fff; border-color: #1e8e3e; font-weight: 600; }
  .hint { font-size: 11px; color: #5f6368; margin-top: 6px; }
  .opt { display: block; margin-top: 10px; font-size: 12px; line-height: 1.35; }
  hr { border: 0; border-top: 1px solid #e8eaed; margin: 12px 0 2px; }
  #report { display: none; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; background: #111; color: #eee; padding: 8px; border-radius: 8px; font: 11px/1.4 ui-monospace, Menlo, monospace; margin-top: 8px; }
</style>
<h1>My tutor <span id="ver" style="font-weight:400;color:#5f6368;font-size:11px"></span></h1>
<p>Your own AI English teacher on YouTube, with your own API key. Open a video: the tutor reads the subtitles, stops at what is hard for you and explains it. The <b>My tutor</b> button under the video turns it off and on.</p>
<div class="row"><button id="dream-settings" class="primary">All settings</button><button id="dream-vocab">📒 My Vocabulary</button></div>
<div class="row"><button id="dream-reader">📖 Read a PDF or text</button><button id="check">🩺 Check for problems</button></div>
<pre id="report"></pre>
<button id="copyReport" style="display:none;margin-top:4px">Copy report</button>
<hr>
<label class="opt"><b>No subtitles for this video?</b> Load a subtitle file (.srt, .vtt or .txt) from any tool:
  <input type="file" id="subfile" accept=".srt,.vtt,.txt,text/*" style="width:100%;margin-top:4px">
</label>
<div id="subMsg" class="hint"></div>
<script src="lib.js"></script>
<script src="popup.js"></script>
